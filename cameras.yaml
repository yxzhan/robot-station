# The station's cameras (cameras.example.yaml: every option).
#   ./station.sh run --rm station python3 -m robot_station.cameras
cameras:
  - name: wrist              # the RealSense D435 on the hand
    type: realsense
    serial: "827112071481"
    width: 640
    height: 480
    fps: 30
    depth: false             # true: also aligned depth (16 bit PNG), recorded

  - name: front              # the Orbbec Astra Pro's colour camera (UVC; its depth is not supported)
    type: usb
    device: /dev/v4l/by-id/usb-Astra_Pro_HD_Camera_Astra_Pro_HD_Camera-video-index0
    width: 640
    height: 480
    fps: 30
    pixel_format: mjpeg2rgb
