# The robot_station package, pip-installable (e.g. for ijcai_2026_workshop's
# giskard demo, which runs `python3 -m robot_station.hw`):
#
#   pip install "git+https://github.com/yxzhan/robot-station"
#   pip install -e .                  (this checkout, editable)
#
# Not listed: rclpy and the ROS messages (the ROS python: /usr/bin/python3 with
# ROS 2 sourced; pip there needs --user --break-system-packages), franka_msgs
# (the franka workspace, docker/Dockerfile), ros2 bag (recording).

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-station"
version = "0.1.0"
description = "A real robot (Franka Panda under franka_ros2) as a ROS 2 system: following robot-lobby over rosbridge, a front end for giskard, recording, a web page"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aiohttp", "pyyaml"]

[tool.setuptools]
packages = ["robot_station", "robot_station.drivers"]

[tool.setuptools.package-data]
robot_station = ["static/*"]
